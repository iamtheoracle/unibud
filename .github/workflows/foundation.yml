name: Foundation checks

on:
  pull_request:
  push:
    branches:
      - main
      - "foundation/**"

permissions:
  contents: read

jobs:
  database-isolation:
    name: PostgreSQL 16 migration and RLS isolation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: unibud_test
          POSTGRES_PASSWORD: unibud_test_only
          POSTGRES_DB: unibud_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U unibud_test -d unibud_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Apply all identity and auth migrations
        env:
          PGPASSWORD: unibud_test_only
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U unibud_test -d unibud_test -f database/migrations/0001_identity_foundation.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U unibud_test -d unibud_test -f database/migrations/0002_identity_access_control.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U unibud_test -d unibud_test -f database/migrations/0003_credentials_and_verification.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U unibud_test -d unibud_test -f database/migrations/0004_first_party_auth_procedures.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U unibud_test -d unibud_test -f database/migrations/0005_profile_access_and_context.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U unibud_test -d unibud_test -f database/migrations/0006_profile_delegation_integrity.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U unibud_test -d unibud_test -f database/migrations/0007_onboarding_acceptances.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U unibud_test -d unibud_test -f database/migrations/0008_auth_session_maintenance.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U unibud_test -d unibud_test -f database/migrations/0009_session_profile_context.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U unibud_test -d unibud_test -f database/migrations/0010_auth_rate_limiting.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U unibud_test -d unibud_test -f database/migrations/0011_profile_invitations.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U unibud_test -d unibud_test -f database/migrations/0012_profile_editing_and_role_permissions.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U unibud_test -d unibud_test -f database/migrations/0013_fail_closed_profile_permission_checks.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U unibud_test -d unibud_test -f database/migrations/0014_profile_delegation_lifecycle.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U unibud_test -d unibud_test -f database/migrations/0015_profile_archive_restore_recovery.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U unibud_test -d unibud_test -f database/migrations/0016_profile_recovery_notifications_and_ownership_guards.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U unibud_test -d unibud_test -f database/migrations/0017_profile_ownership_transfer.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U unibud_test -d unibud_test -f database/migrations/0018_account_dependency_discovery.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U unibud_test -d unibud_test -f database/migrations/0019_external_dependency_registry.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U unibud_test -d unibud_test -f database/migrations/0020_session_derived_operations_rbac.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U unibud_test -d unibud_test -f database/migrations/0021_non_forgeable_operations_actor.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U unibud_test -d unibud_test -f database/migrations/0022_operations_mfa_storage.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U unibud_test -d unibud_test -f database/migrations/0023_operations_session_context_verifier.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U unibud_test -d unibud_test -f database/migrations/0024_operations_mfa_session_step_up.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U unibud_test -d unibud_test -f database/migrations/0025_operations_mfa_password_reauthenticated_enrollment.sql
      - name: Verify identity and RLS isolation
        env:
          PGPASSWORD: unibud_test_only
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U unibud_test -d unibud_test -f database/tests/0001_identity_foundation.test.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U unibud_test -d unibud_test -f database/tests/0002_identity_access_control.test.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U unibud_test -d unibud_test -f database/tests/0003_credentials_and_verification.test.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U unibud_test -d unibud_test -f database/tests/0004_first_party_auth_procedures.test.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U unibud_test -d unibud_test -f database/tests/0005_profile_access_and_context.test.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U unibud_test -d unibud_test -f database/tests/0006_profile_delegation_integrity.test.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U unibud_test -d unibud_test -f database/tests/0007_onboarding_acceptances.test.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U unibud_test -d unibud_test -f database/tests/0008_auth_session_maintenance.test.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U unibud_test -d unibud_test -f database/tests/0009_session_profile_context.test.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U unibud_test -d unibud_test -f database/tests/0010_auth_rate_limiting.test.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U unibud_test -d unibud_test -f database/tests/0011_profile_invitations.test.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U unibud_test -d unibud_test -f database/tests/0012_profile_editing_and_role_permissions.test.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U unibud_test -d unibud_test -f database/tests/0013_profile_delegation_lifecycle.test.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U unibud_test -d unibud_test -f database/tests/0015_profile_archive_restore_recovery.test.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U unibud_test -d unibud_test -f database/tests/0016_profile_recovery_notifications_and_ownership_guards.test.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U unibud_test -d unibud_test -f database/tests/0017_profile_ownership_transfer.test.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U unibud_test -d unibud_test -f database/tests/0018_account_dependency_discovery.test.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U unibud_test -d unibud_test -f database/tests/0019_external_dependency_registry.test.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U unibud_test -d unibud_test -f database/tests/0020_session_derived_operations_rbac.test.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U unibud_test -d unibud_test -f database/tests/0021_non_forgeable_operations_actor.test.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U unibud_test -d unibud_test -f database/tests/0022_operations_mfa_storage.test.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U unibud_test -d unibud_test -f database/tests/0023_operations_session_context_verifier.test.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U unibud_test -d unibud_test -f database/tests/0024_operations_mfa_session_step_up.test.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U unibud_test -d unibud_test -f database/tests/0025_operations_mfa_password_reauthenticated_enrollment.test.sql
      - name: Verify concurrent MFA assertion replay prevention
        env:
          PGPASSWORD: unibud_test_only
        run: bash scripts/test-operations-mfa-concurrency.sh
  foundation-integrity:
    name: Foundation integrity
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Verify required foundation files
        run: bash scripts/check-docs.sh
