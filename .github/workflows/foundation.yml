      - name: Provision disposable least-privilege scheduler login
        env:
          PGPASSWORD: unibud_test_only
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U unibud_test -d unibud_test -c "CREATE ROLE unibud_ops_scheduler_ci LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT PASSWORD 'ci_scheduler_only';"
          psql -v ON_ERROR_STOP=1 -h localhost -U unibud_test -d unibud_test -c "GRANT CONNECT ON DATABASE unibud_test TO unibud_ops_scheduler_ci;"
