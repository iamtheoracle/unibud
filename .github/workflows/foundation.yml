name: Foundation checks

on:
  pull_request:
  push:
    branches:
      - main
      - "foundation/**"

permissions:
  contents: read

jobs:
  database-isolation:
    name: PostgreSQL 16 migration and RLS isolation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: unibud_test
          POSTGRES_PASSWORD: unibud_test_only
          POSTGRES_DB: unibud_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U unibud_test -d unibud_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Apply all identity and auth migrations
        env:
          PGPASSWORD: unibud_test_only
