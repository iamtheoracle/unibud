name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      # The existing repository has legacy unused-import errors across unrelated files.
      # Keep CI focused on linting the touched entry routes until that backlog is cleaned up.
      - name: Lint entry and routing files
        run: npx eslint src/pages/Welcome.jsx src/pages/Riff.jsx src/App.jsx --quiet
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build
