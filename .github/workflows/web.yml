name: UNIBUD Web and Database
on:
  pull_request:
  push:
    branches:
      - main
      - "foundation/**"
permissions:
  contents: read
jobs:
  database-migration:
    name: PostgreSQL migration validation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: unibud_test
          POSTGRES_PASSWORD: unibud_test_only
          POSTGRES_DB: unibud_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U unibud_test -d unibud_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply identity migration
        env:
          PGPASSWORD: unibud_test_only
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U unibud_test -d unibud_test -f database/migrations/0001_identity_foundation.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U unibud_test -d unibud_test -f database/migrations/0002_identity_access_control.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U unibud_test -d unibud_test -f database/migrations/0003_credentials_and_verification.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U unibud_test -d unibud_test -f database/migrations/0004_first_party_auth_procedures.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U unibud_test -d unibud_test -f database/migrations/0005_profile_access_and_context.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U unibud_test -d unibud_test -f database/migrations/0006_profile_delegation_integrity.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U unibud_test -d unibud_test -f database/migrations/0007_onboarding_acceptances.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U unibud_test -d unibud_test -f database/migrations/0008_auth_session_maintenance.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U unibud_test -d unibud_test -f database/migrations/0009_session_profile_context.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U unibud_test -d unibud_test -f database/migrations/0010_auth_rate_limiting.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U unibud_test -d unibud_test -f database/migrations/0011_profile_invitations.sql
      - name: Verify identity constraints and audit immutability
        env:
          PGPASSWORD: unibud_test_only
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U unibud_test -d unibud_test -f database/tests/0001_identity_foundation.test.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U unibud_test -d unibud_test -f database/tests/0002_identity_access_control.test.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U unibud_test -d unibud_test -f database/tests/0003_credentials_and_verification.test.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U unibud_test -d unibud_test -f database/tests/0004_first_party_auth_procedures.test.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U unibud_test -d unibud_test -f database/tests/0005_profile_access_and_context.test.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U unibud_test -d unibud_test -f database/tests/0006_profile_delegation_integrity.test.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U unibud_test -d unibud_test -f database/tests/0007_onboarding_acceptances.test.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U unibud_test -d unibud_test -f database/tests/0008_auth_session_maintenance.test.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U unibud_test -d unibud_test -f database/tests/0009_session_profile_context.test.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U unibud_test -d unibud_test -f database/tests/0010_auth_rate_limiting.test.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U unibud_test -d unibud_test -f database/tests/0011_profile_invitations.test.sql
  web-checks:
    name: Web build and type checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Type check
        run: pnpm typecheck
      - name: Contract tests
        run: pnpm --filter @unibud/contracts test
      - name: Server security unit tests
        run: pnpm --filter @unibud/web test
      - name: Lint
        run: pnpm lint
      - name: Install Playwright and Chromium
        run: |
          npm install --global playwright@1.56.1
          playwright install --with-deps chromium
      - name: Profile browser end-to-end tests
        env:
          UNIBUD_E2E_TEST_MODE: "true"
          UNIBUD_E2E_BASE_URL: http://127.0.0.1:3100
        run: |
          set -euo pipefail
          pnpm --filter @unibud/web dev -- --hostname 127.0.0.1 --port 3100 > /tmp/unibud-e2e-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          READY=0
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:3100/__e2e/profiles > /dev/null; then
              READY=1
              break
            fi
            sleep 2
          done
          if [ "$READY" -ne 1 ]; then
            cat /tmp/unibud-e2e-next.log
            exit 1
          fi
          PLAYWRIGHT_MODULE="$(npm root -g)/playwright/index.mjs" node scripts/e2e/profiles.mjs
      - name: Build
        run: pnpm build
