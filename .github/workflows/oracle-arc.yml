# Keep the independent Oracle Arc API regression workflow active on foundation updates.
name: Oracle Arc API

on:
  pull_request:
  push:
    branches:
      - main
      - "foundation/**"

permissions:
  contents: read

jobs:
  api-tests:
    name: Oracle Arc API tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: oracle_arc_ci
          POSTGRES_DB: oracle_arc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d oracle_arc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: oracle-arc/api
    env:
      ORACLE_ARC_MIGRATION_DATABASE_URL: postgresql://postgres:oracle_arc_ci@localhost:5432/oracle_arc_test
      ORACLE_ARC_TEST_ADMIN_DATABASE_URL: postgresql://postgres:oracle_arc_ci@localhost:5432/oracle_arc_test
      ORACLE_ARC_DATABASE_URL: postgresql://oracle_arc_runtime:oracle_arc_ci_only@localhost:5432/oracle_arc_test
      ORACLE_ARC_ENVIRONMENT: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: oracle-arc/api/requirements-dev.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Apply independent Oracle Arc PostgreSQL migrations
        run: python migrate.py
      - name: Configure least-privilege runtime login for CI
        run: |
          python - <<'PY'
          import os
          import psycopg

          with psycopg.connect(os.environ["ORACLE_ARC_MIGRATION_DATABASE_URL"]) as connection:
              connection.execute(
                  "ALTER ROLE oracle_arc_runtime LOGIN PASSWORD 'oracle_arc_ci_only'"
              )
          PY
      - name: Run API and PostgreSQL security tests
        run: python -m pytest -q
