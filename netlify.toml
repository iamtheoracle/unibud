[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

# SPA fallback so client-side routes (e.g. /welcome, /riff) resolve on direct load
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
